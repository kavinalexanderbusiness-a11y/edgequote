name: CI

# WHY THIS EXISTS
# Until now this repo had no CI at all. The only gate on main was a human
# remembering to run `tsc` and `next build` before pushing — and several sessions
# push to main every day. One forgotten check ships a main that doesn't compile,
# and the next person to branch inherits it.
#
# This runs the exact two commands that were being run by hand, plus lint, on
# every push and every PR. Nothing clever; the point is that it is not optional.

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked after a fix without an empty commit.
  workflow_dispatch:
    inputs:
      proof:
        description: 'Explicit isolated prerequisite; ordinary CI remains the default'
        type: choice
        default: normal
        options: [normal, quote-save-authority, quote-save-authenticated]
      authority_expectation:
        description: 'Only for the isolated source-bound authority proof'
        type: choice
        default: corrected
        options: [vulnerable, corrected]

# A newer push to the same branch makes the older run pointless — cancel it
# rather than queue behind it. Never cancel main: its runs are the record of
# whether the deployed commit was green.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.proof || 'normal' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.proof != 'quote-save-authority' && inputs.proof != 'quote-save-authenticated') }}
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # PLACEHOLDERS, not secrets. Every page in this app is server-rendered on
      # demand (`ƒ` in the build output) and the Supabase clients read env inside
      # functions rather than at module scope — so nothing contacts Supabase during
      # `next build`. NEXT_PUBLIC_* are inlined at build time, so they must merely
      # EXIST for the bundle to be well-formed; these values are never deployed and
      # never reach a network.
      #
      # If a future page starts fetching at build time, this job will fail loudly
      # against these fake values. That is the correct outcome — a build that
      # silently depends on production credentials is the thing worth catching.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
      NEXT_PUBLIC_APP_URL: https://example.invalid
      # Next telemetry adds latency and noise to every CI run.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      # ⚠️⚠️ NODE 22 IS A FLOOR, NOT A PREFERENCE. @supabase/realtime-js refuses to
      # construct a client without a WebSocket implementation, and its own source
      # says why: "Node.js < 22 doesn't have native WebSocket". On 20 it throws
      #     Error: Node.js 20 detected without native WebSocket support
      # the moment anything builds a Supabase client — which verify:comm-prefs does
      # when it renders the screen. That failure was invisible for days: every
      # developer here runs Node 24, so the suite was green locally and red in CI
      # with no diff to explain it, and reproducing CI's env, its LF line endings
      # and its placeholder credentials all still passed. Only the runner's own log
      # named it. The floor is also declared in package.json engines, so the two
      # cannot drift apart again.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` not `npm install`: it installs exactly the lockfile and fails if
      # package.json and package-lock.json disagree. That disagreement is itself a
      # bug worth failing on — it means someone hand-edited a dependency.
      - name: Install
        run: npm ci

      # Typecheck FIRST. It is the fastest of the three and catches the most, so a
      # broken branch fails in ~30s instead of after a full build.
      - name: Typecheck
        run: npm run typecheck

      # ── The verify suite, as ONE step ────────────────────────────────────────
      # scripts/verify-all.ts runs every scripts/verify-<domain>.ts guard and
      # FIRST enforces the parity contract (every file ↔ npm script ↔ canonical
      # command), so a guard can never silently drop out of CI again. This
      # replaced ~35 hand-listed steps that had already drifted twice: three
      # duplicated entries and ten suites missing entirely after a merge train.
      # Each guard's rationale lives in its own script header — one home, not two.
      - name: Verify suite (all guards + parity)
        run: npm run verify

      - name: Preserve owner auxiliary-loader browser proof
        if: ${{ always() && hashFiles('outputs/pilot-full-quote-save-20260910/quote-auxiliary-loader-proof.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pilot-quote-auxiliary-loader-${{ github.sha }}
          path: outputs/pilot-full-quote-save-20260910/quote-auxiliary-loader-proof.json
          if-no-files-found: error
          retention-days: 14

      # ── Lint and Build — the two stages this job has been NAMED for since it
      # was created, and never actually ran. The file ended at `verify`, so
      # "typecheck · lint · build" promised two gates that did not exist: a lint
      # error or a broken `next build` could land on main with a green check.
      # (Nobody noticed because setup-node was failing before any step ran — see
      # the lockfile note above. Fixing the install is what made the gap visible.)
      #
      # Lint before build: it is the faster of the two, and a build failure after
      # a 90-second compile tells you less than the lint line that caused it.
      # `next lint` exits 0 on warnings and non-zero on errors, which is the
      # behaviour we want — the repo carries a handful of long-standing warnings
      # and gating on those would be a rule change, not a CI fix.
      - name: Lint
        run: npm run lint

      # The real production compile, with the placeholder env from the job block
      # above. This is the gate that catches a page which only breaks when it is
      # actually rendered — the class tsc cannot see.
      - name: Build
        run: npm run build

  quote-save-authenticated:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.proof == 'quote-save-authenticated' }}
    name: Disposable real Auth and browser quote Save
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the existing locked app dependencies
        run: npm ci
      - name: Install only pinned browser protocol tooling
        run: npm ci --prefix scripts/authenticated-quote-save/tools --ignore-scripts --no-audit --no-fund
      - name: Real isolated Auth, native commit and browser Save
        run: node scripts/authenticated-quote-save/real-platform-proof.mjs
      - name: Preserve bounded real-platform evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-save-authenticated-${{ github.sha }}
          path: outputs/authenticated-quote-save-real-20260911/*.json
          if-no-files-found: error
          retention-days: 14

  quote-save-authority:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.proof == 'quote-save-authority' }}
    name: Isolated dormant quote Save authority prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: pilot_test
          POSTGRES_PASSWORD: pilot_disposable_password_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PILOT_EMAIL_DISPOSABLE: EDGEHQ_LOCAL_PG17_PILOT_TEST_ONLY
      PILOT_AUTHORITY_EXPECT: ${{ inputs.authority_expectation }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Mark only the fixed disposable database
        env:
          PGPASSWORD: pilot_disposable_password_not_a_secret
        run: psql --no-psqlrc --no-password --host=127.0.0.1 --port=5432 --username=postgres --dbname=pilot_test --set=ON_ERROR_STOP=on --command="COMMENT ON DATABASE pilot_test IS 'edgehq disposable pilot schema proof; never production'"
      - name: Focused authority and adapter typecheck
        run: node node_modules/typescript/bin/tsc --project scripts/authenticated-quote-save/tsconfig.authority.json
      - name: Native and synthetic-server owner authority proof
        run: node node_modules/tsx/dist/cli.mjs scripts/authenticated-quote-save/authority-proof.ts
      - name: Preserve bounded authority receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-save-authority-${{ inputs.authority_expectation }}-${{ github.sha }}
          path: outputs/authenticated-quote-authority-20260911/authority-proof.json
          if-no-files-found: error
          retention-days: 14
